[build]
  base = "apps/web"
  command = "cd ../.. && npm install && npm run build:web"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
  conditions = {Language = ["en", "en-CA", "en-US", "en-GB"]}

[[redirects]]
  from = "/"
  to = "/fr"
  status = 302
  conditions = {Language = ["fr", "fr-CA", "fr-FR"]}

[[redirects]]
  from = "/"
  to = "/en"
  status = 302
